<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Oracle v17.5 - Harmony</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --void: #050508;
            --wild: #a855f7;
            --temp: #ef4444;
            --arcana: #0ea5e9;
            --glass: rgba(20, 20, 25, 0.7);
            --border: rgba(212,175,55,0.2);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--void);
            color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            position: fixed;
            user-select: none;
        }
        .font-header { font-family: 'Cinzel', serif; }
        .font-mystic { font-family: 'Cormorant Garamond', serif; }

        /* --- VISUAL UPGRADE START: DYNAMIC UNIVERSE --- */
        #universe {
            position: fixed; inset:0; z-index:1;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000 100%);
            overflow: hidden;
        }
        /* Efek Bintang/Debu Kosmik */
        #universe::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            animation: cosmicDrift 60s linear infinite;
            opacity: 0.6;
        }
        @keyframes cosmicDrift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* --- VISUAL UPGRADE END --- */

        #chat-area { position: relative; flex:1; width:100%; overflow-y:auto; padding:15px; z-index:10; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }

        .bubble {
            padding:12px 16px; border-radius:18px; font-size:14px; position:relative; max-width:85%; z-index:20; transition: transform 0.3s ease; touch-action: pan-x;
        }
        .bubble-me { background: rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.25); border-bottom-right-radius:2px; }
        .bubble-other { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-bottom-left-radius:2px; }
        
        .bubble-vo-img { background: rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.4); cursor:pointer; }
        .bubble-vo-text { background: rgba(239,68,68,0.03); border:1px solid rgba(239,68,68,0.2); cursor:pointer; }

        #notif-toast {
            position: fixed; top:20px; left:50%; transform: translateX(-50%) translateY(-150px);
            width:92%; max-width:400px; background: rgba(10,10,15,0.95); border:1px solid var(--gold);
            padding:14px; border-radius:16px; z-index:10000; transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1.1);
            backdrop-filter: blur(20px); pointer-events: none; display:flex; gap:12px; align-items:center;
        }
        #notif-toast.show { transform: translateX(-50%) translateY(0); pointer-events:auto; }
        #notif-icon-box { width:48px; height:48px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:20px; }
        #notif-name { font-family: 'Cinzel', serif; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:2px; }

        .control-bar { width:100%; background:#000; border-top:1px solid rgba(255,255,255,0.1); z-index:500; padding:1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }

        .modal-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.92); z-index:8000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; backdrop-filter: blur(15px); }
        .modal-active { opacity:1; pointer-events:auto; }

        .layer { position:absolute; inset:0; z-index:1000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; transition: all 1s ease; background:var(--void); }
        .layer-hidden { opacity:0 !important; pointer-events:none !important; visibility:hidden !important; z-index:-1; }

        #conn-status { position:fixed; top:70px; left:50%; transform:translateX(-50%); font-size:8px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; z-index:2000; opacity:0; transition:0.5s; background: rgba(0,0,0,0.9); border:1px solid rgba(212,175,55,0.4); padding:6px 16px; border-radius:20px; pointer-events:none; white-space: nowrap; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        #conn-status.active { opacity:1; }

        .fate-card { 
            background: linear-gradient(145deg, rgba(20,20,20,0.9), rgba(0,0,0,0.95));
            border: 1px solid rgba(212,175,55,0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            animation: cardAppear 0.5s ease-out;
        }
        @keyframes cardAppear { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .fate-wild { border-color: var(--wild); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
        .fate-truth { border-color: var(--arcana); box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
        .fate-dare { border-color: var(--temp); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }

        #vo-full-img { max-width:95vw; max-height:60vh; border:2px solid var(--temp); box-shadow:0 0 30px rgba(239,68,68,0.2); border-radius:12px; }
        #vo-text-container { width: 90%; max-width: 400px; padding: 2rem; border: 1px solid var(--temp); background: rgba(20,0,0,0.9); box-shadow: 0 0 30px rgba(239,68,68,0.2); border-radius: 12px; text-align: center; }

        .reply-box {
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            background: rgba(212,175,55,0.05);
            border-left: 2px solid var(--gold);
            padding: 6px 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }
        .reply-sender { font-weight: 800; color: var(--gold); letter-spacing: 0.5px; margin-bottom: 2px; }
        .reply-content { font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .notif-gold { background: rgba(212,175,55,0.1); color: var(--gold); border:1px solid var(--gold); }

        /* --- TRANSISI ANIMASI MASUK (PORTAL EFFECT) --- */
        #portal-overlay {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }
        #portal-overlay.active { opacity: 1; pointer-events: auto; background: radial-gradient(circle, #D4AF37 0%, #000 70%); }
        
        /* Input Styling yang dipercantik */
        #name-input {
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(212,175,55,0.5);
        }
        #name-input:focus {
            border-bottom-color: var(--gold);
            transform: scale(1.05);
        }
        /* Tombol Masuk Pulsing */
        .btn-enter {
            animation: pulseGold 2s infinite;
        }
        @keyframes pulseGold {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
    </style>
</head>
<body>

    <div id="universe"></div>
    
    <!-- Portal Overlay untuk Transisi -->
    <div id="portal-overlay"><div class="text-black font-header text-xl tracking-[10px] animate-pulse">ASCENDING...</div></div>

    <div id="conn-status">Menginisialisasi...</div>

    <!-- Visual Notification -->

        <div id="notif-icon-box" class="notif-gold">✨</div>
        <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
                <p id="notif-name">ORACLE</p>
                <div style="font-size:9px; opacity:0.6;" id="notif-time">SEKARANG</div>
            </div>

        </div>
    </div>

    <!-- Security -->
    <div id="layer-sec" class="layer">
        <div class="text-center space-y-12 w-full max-w-[280px]">
            <h1 class="font-header text-2xl tracking-[12px] text-gold animate-pulse">GATEWAY</h1>
            <input id="sec-input" type="password" maxlength="6" class="bg-transparent border-b border-gold/60 text-center w-full py-4 outline-none tracking-[20px] text-gold text-2xl" placeholder="••••••" inputmode="numeric">
        </div>
    </div>

    <!-- Naming (Dipercantik) -->
    <div id="layer-name" class="layer layer-hidden">
        <div class="w-full max-w-[300px] space-y-10 text-center relative z-20">
            <!-- Dekorasi Lingkaran -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-gold/10 rounded-full animate-spin-slow pointer-events-none" style="animation-duration: 20s;"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] border border-gold/20 rounded-full pointer-events-none"></div>

            <h2 class="font-header text-gold tracking-[6px] text-[12px] uppercase opacity-80 drop-shadow-[0_0_5px_rgba(212,175,55,0.5)]">Identitas Jiwa</h2>
            <input id="name-input" type="text" maxlength="12" class="bg-transparent border-b border-gold/30 text-center w-full py-4 outline-none font-mystic text-4xl text-white placeholder-white/10" placeholder="Namamu...">
            <button onclick="ascend()" class="btn-enter w-full border border-gold text-gold py-5 mt-12 font-header text-[10px] tracking-[8px] hover:bg-gold hover:text-black transition-all duration-500 uppercase">Manifestasi</button>
        </div>
    </div>

    <!-- Main Chat -->
    <div id="layer-main" class="layer layer-hidden !p-0 !justify-start !bg-transparent !z-10">
        <div class="w-full p-4 flex justify-between items-center border-b border-white/5 bg-black/95 z-[600]">
            <div class="font-header text-gold text-[9px] tracking-[4px]">ORACLE v17.5 <span class="text-[6px] opacity-50 ml-1">HARMONY</span></div>
            <button onclick="toggleNav(true)" class="text-gold border border-gold/20 px-5 py-2 rounded-full font-header text-[8px] tracking-[2px] active:bg-gold/10">MENU</button>
        </div>

        <div id="chat-area">
            <div id="chat-feed" class="flex flex-col gap-4 py-6"></div>
        </div>

        <!-- Controls -->
        <div class="control-bar">
            <!-- Status Bar Reply/Edit -->
            <div id="status-bar" class="hidden px-4 py-2 bg-zinc-900 mb-2 border-l-2 border-gold text-[10px] flex justify-between items-center rounded-r">
                <div class="flex flex-col overflow-hidden mr-2">
                    <span id="status-label" class="text-gold font-bold text-[8px] uppercase tracking-wider mb-1">MEMBALAS</span>

                </div>

            </div>

            <!-- Image Preview -->
            <div id="img-preview-container" class="hidden mb-3 mx-4 border border-gold/30 rounded-lg overflow-hidden relative w-fit">

            </div>

            <div class="px-2 mb-4">
                <button id="fate-btn" onclick="getFate()" class="w-full border border-gold/30 text-gold/80 p-3 font-header text-[9px] tracking-[3px] bg-gold/5 uppercase active:scale-[0.98] transition-all hover:bg-gold/10 hover:border-gold/60">
                    🎴 Tarik Kartu Takdir
                </button>
            </div>

            <div class="flex gap-3 items-center">
                <div id="vo-toggle" onclick="toggleVO()" class="w-[40px] h-[40px] border border-zinc-700 rounded-full flex items-center justify-center text-[9px] text-zinc-500 font-header cursor-pointer transition-all select-none hover:border-zinc-500">VO</div>

                <label class="cursor-pointer text-gold/60 p-2 active:scale-110 transition-transform">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <input type="file" id="img-input" accept="image/*" class="hidden" onchange="previewImg(this)">
                </label>

                <button id="mic-btn" onclick="startVoiceRecording()" class="w-[42px] h-[42px] rounded-full border border-zinc-700 flex items-center justify-center text-gold/60 active:scale-110 active:bg-gold/10 transition-all">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>

                <button onclick="send()" id="send-btn" class="text-gold text-2xl px-2 active:scale-90 transition-transform">➤</button>
            </div>
        </div>
    </div>

    <!-- Menus & Modals -->
    <div id="nav-menu" class="modal-overlay" onclick="toggleNav(false)">
        <div class="w-full max-w-xs p-6 bg-zinc-950 border border-gold/20 space-y-4 rounded-xl shadow-2xl" onclick="event.stopPropagation()">
            <h2 class="font-header text-gold text-center text-lg mb-6 tracking-widest">SISTEM</h2>
            <button onclick="requestNotifPermission()" class="w-full p-4 border border-gold/40 text-gold text-[9px] tracking-[3px] font-header uppercase hover:bg-gold/10 transition-colors">AKTIFKAN NOTIFIKASI</button>

            <button onclick="clearHistory()" class="w-full p-4 border border-red-900/40 text-red-500 text-[9px] tracking-[3px] font-header uppercase hover:text-red-400">HAPUS CHAT</button>
        </div>
    </div>

    <div id="context-menu" class="modal-overlay" onclick="this.classList.remove('modal-active')">
        <div class="bg-zinc-900 border border-gold/20 w-64 p-2 rounded-lg shadow-2xl space-y-1" onclick="event.stopPropagation()">
            <button onclick="handleCopy()" class="w-full text-left p-3 text-white text-xs hover:bg-white/5 rounded">📋 Salin Teks</button>
            <button id="btn-edit" onclick="handleEdit(event)" class="hidden w-full text-left p-3 text-blue-400 text-xs hover:bg-white/5 rounded">✏️ Edit Pesan</button>

        </div>

        let deckState = JSON.parse(localStorage.getItem('oracle_deck_v2')) || {

        function saveDeck() { localStorage.setItem('oracle_deck_v2', JSON.stringify(deckState)); }

        function drawCard(type) {
            if (deckState[type].length === 0) {
                deckState[type] = [...MASTER_DECK[type]];
            }
            const idx = Math.floor(Math.random() * deckState[type].length);
            const content = deckState[type][idx];
            deckState[type].splice(idx, 1);
            saveDeck();
            return content;
        }

        function resetFateDeck() {
            localStorage.removeItem('oracle_deck_v2');
            deckState = { truth: [...MASTER_DECK.truth], dare: [...MASTER_DECK.dare], wildcard: [...MASTER_DECK.wildcard] };
            alert("Kartu Takdir telah dikocok ulang!");
            toggleNav(false);
        }

        async function getFate() {
            const roll = Math.random();
            let type = 'truth';
            if (roll < 0.10) type = 'wildcard';
            else if (roll < 0.55) type = 'dare';
            
            const content = drawCard(type);
            const payload = { 
                nama: "ORACLE", 
                teks: JSON.stringify({ 
                    type: type.toUpperCase(), 
                    content: content, 
                    invoker: myName 
                }) 
            };
            const { error } = await supa.from('Pesan').insert([payload]);
            if(error) offlineQueue.push(payload);
        }

        /* ===================== NOTIFICATION SYSTEM (HYBRID) ===================== */
        
        function requestNotifPermission() {
            if (!("Notification" in window)) return;
            Notification.requestPermission().then(res => {
                if(res === 'granted') {
                    if (navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({
                            type: 'SHOW_NOTIFICATION',
                            payload: { title: 'Oracle System', body: 'Notifikasi Background Aktif' }
                        });
                    } else {
                        new Notification("Oracle System", { body: "Notifikasi Aktif", tag: 'oracle-sys' });
                    }
                }
            });
        }

        function getCleanText(rawMsg) {
            if (!rawMsg) return "Pesan kosong";

            if (rawMsg.startsWith(">>REPLY")) {
                const parts = rawMsg.split(">>");
                if (parts.length > 2) {
                    rawMsg = parts.slice(2).join(">>");
                }
            }

            if (rawMsg.includes("[VN]")) return "🎤 Pesan Suara";
            if (rawMsg.startsWith("[VO]")) return "🔒 Pesan Rahasia";
            if (rawMsg.includes("[IMG]")) return "🖼️ Gambar";
            
            if (rawMsg.startsWith("{") && rawMsg.includes("type")) {
                try {
                    const d = JSON.parse(rawMsg);
                    return `🎴 Kartu ${d.type}: ${d.content}`;
                } catch(e) {}
            }

            return rawMsg;
        }

        function triggerSystemNotif(msg) {
            if (Notification.permission !== "granted" || !document.hidden) return;

            const cleanBody = getCleanText(msg.teks);
            const title = msg.nama === "ORACLE" ? "Oracle Fate" : msg.nama;

            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({
                    type: 'SHOW_NOTIFICATION',
                    payload: {
                        title: title,
                        body: cleanBody
                    }
                });
            } else {
                const n = new Notification(title, {
                    body: cleanBody,
                    icon: 'https://cdn-icons-png.flaticon.com/512/3062/3062634.png', 
                    tag: 'oracle-universe-chat', 
                    renotify: true,
                    silent: false
                });
                n.onclick = () => { window.focus(); n.close(); };
            }
        }

        /* ===================== MESSAGING LOGIC ===================== */

        function handleIncomingMessage(msg) {
            if (msg.id <= lastMessageId && !isInitialLoad) return;
            render(msg, true);
            if (msg.id > lastMessageId) lastMessageId = msg.id;
            
            if (msg.nama !== myName && !isInitialLoad) {
                const toast = document.getElementById('notif-toast');
                document.getElementById('notif-name').innerText = msg.nama;
                document.getElementById('notif-text').innerText = getCleanText(msg.teks);
                toast.classList.remove('show');
                void toast.offsetWidth; 
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);

                triggerSystemNotif(msg);
            }
        }

        async function send(customContent = null) {
            const inp = document.getElementById('chat-msg');
            let val = customContent || inp.value.trim();
            const currentEditId = editId;

            if(!val && !pendingImg && !customContent) return;

            let content = val;
            
            if (!currentEditId) {
                if(pendingImg) {
                    content = isVO ? `[VO][IMG]${pendingImg}${val ? '|'+val : ''}` : `[IMG]${pendingImg}${val ? '|'+val : ''}`;
                } else if(isVO && !content.startsWith("[VN]")) {
                    content = `[VO]${content}`;
                }
                
                if(replyTo) {
                    content = `>>REPLY|${replyTo.sender}|${replyTo.snippet}>>${content}`;
                }
            }

            const payload = { nama: myName, teks: content };

            inp.value = "";
            clearImage();
            if(isVO) toggleVO();
            clearStatus(); 

            if(currentEditId) {
                await supa.from('Pesan').update({ teks: val }).eq('id', currentEditId);
                return;
            }

            try {
                const { error } = await supa.from('Pesan').insert([payload]);
                if(error) throw error;
            } catch (err) {
                offlineQueue.push(payload);
                updateConnStatus("Offline. Mengantre...", 'error');
            }
        }

        /* ===================== RENDERING (FIXED VO IMG) ===================== */

        function render(msg, scroll = false) {
            const feed = document.getElementById('chat-feed');
            let existing = document.getElementById(`m-${msg.id}`);
            const isMe = msg.nama === myName;
            let raw = msg.teks || "";
            let replyHtml = "";

            if(raw.startsWith(">>REPLY|")) {
                const parts = raw.split(">>");
                if (parts.length >= 3) {
                    const meta = parts[1].split("|");
                    replyHtml = `<div class="reply-box">
                        <span class="reply-sender">${meta[1]}</span>
                        <span class="reply-content">${meta.slice(2).join("|")}</span>
                    </div>`;
                    raw = parts.slice(2).join(">>");
                }
            }

            let bodyHtml = "";
            let bubbleClass = isMe ? 'bubble-me' : 'bubble-other';

            if (msg.nama === "ORACLE") {
                try {
                    const d = JSON.parse(raw);
                    let borderColor = d.type === 'WILDCARD' ? 'fate-wild' : (d.type === 'DARE' ? 'fate-dare' : 'fate-truth');
                    bodyHtml = `<div class="mx-auto my-2 p-4 rounded-xl text-center fate-card ${borderColor} relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                        <p class="text-[8px] font-header text-white/40 uppercase tracking-[4px] mb-2">${d.type}</p>
                        <p class="font-mystic text-white italic text-lg leading-relaxed mb-3">"${d.content}"</p>
                        <p class="text-[8px] text-zinc-500">Dipanggil oleh ${d.invoker}</p>
                    </div>`;
                } catch(e) { bodyHtml = `<div class="text-red-500 text-xs">Kartu Rusak</div>`; }

            // --- RESTORED: VIEW ONCE IMAGE LOGIC ---
            } else if(raw.startsWith("[VO][IMG]")) {
                 const cleanContent = raw.replace(/'/g, "\\'");
                 bubbleClass = 'bubble-vo-img'; // Class khusus untuk styling
                 bodyHtml = `<div onclick="openViewOnce(${msg.id}, '${cleanContent}', 'image')" 
                    class="flex flex-col items-center justify-center gap-2 py-4 px-6">
                    <div class="text-2xl animate-pulse">👁️‍🗨️</div>
                    <div class="text-[9px] font-header text-red-400 uppercase tracking-widest border-b border-red-500/30 pb-1">Gema Tersembunyi</div>
                    <div class="text-[8px] text-red-500/50 italic">Tap untuk melihat sekali</div>
                 </div>`;

            // --- RESTORED: VIEW ONCE TEXT LOGIC ---
            } else if(raw.startsWith("[VO]")) {
                 const clean = raw.replace(/'/g, "\\'");
                 bubbleClass = 'bubble-vo-text';
                 bodyHtml = `<div onclick="openViewOnce(${msg.id}, '${clean}', 'text')" 
                    class="flex items-center gap-3">
                    <span class="text-xl animate-pulse">🔒</span>
                    <div class="flex flex-col">
                        <span class="text-[9px] text-red-400 font-bold uppercase tracking-wider">Pesan Rahasia</span>
                        <span class="text-[8px] text-red-500/60">Tap untuk memusnahkan</span>
                    </div>
                 </div>`;

            } else if(raw.includes("[VN]")) {
                const url = raw.split("[VN]")[1];
                bodyHtml = `<div class="flex items-center gap-2 min-w-[160px]">
                    <div class="w-8 h-8 rounded-full bg-gold/20 flex items-center justify-center text-gold">▶</div>
                    <audio controls src="${url}" class="h-8 w-32 opacity-50 hover:opacity-100 transition-opacity"></audio>
                </div>`;
            } else if(raw.startsWith("[IMG]")) {
                const parts = raw.replace("[IMG]","").split("|");
                bodyHtml = `<img src="${parts[0]}" class="rounded-lg max-w-[200px] border border-white/10 mb-1">
                            ${parts[1] ? `<p class="text-sm mt-1 opacity-90">${parts[1]}</p>` : ''}`;
            } else {
                bodyHtml = `<div class="font-mystic text-[15px] leading-relaxed whitespace-pre-wrap">${raw}</div>`;
            }

            const html = `
                <span class="text-[8px] font-bold text-zinc-600 uppercase mb-1 ml-1 tracking-wider flex justify-between px-1">
                    ${msg.nama}
                </span>
                <div class="bubble ${bubbleClass}">
                    ${replyHtml}
                    ${bodyHtml}
                    <span class="text-[7px] text-white/20 absolute bottom-1 right-2">${new Date(msg.created_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</span>
                </div>
            `;

            if(existing) {
                existing.innerHTML = html;
                const bub = existing.querySelector('.bubble');
                if(!raw.startsWith("[VO]")) bub.onclick = (e) => { e.stopPropagation(); showOpts(msg, isMe); };
            } else {
                const d = document.createElement('div');
                d.id = `m-${msg.id}`;
                d.className = `px-2 flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-1 animate-fade-in`;
                d.innerHTML = html;
                setupSwipe(d, msg);
                feed.appendChild(d);
                const bub = d.querySelector('.bubble');
                if(!raw.startsWith("[VO]")) bub.onclick = (e) => { e.stopPropagation(); showOpts(msg, isMe); };
            }
            if(scroll) feed.scrollTop = feed.scrollHeight;
        }

        /* ===================== SWIPE & UTILS ===================== */
        
        function setupSwipe(el, msg) {
            let startX = 0;
            const bub = el.querySelector('.bubble');
            el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
            el.addEventListener('touchmove', e => {
                let diff = e.touches[0].clientX - startX;
                if(diff > 0 && diff < 80) bub.style.transform = `translateX(${diff}px)`;
            }, {passive: true});
            el.addEventListener('touchend', e => {
                let diff = e.changedTouches[0].clientX - startX;
                bub.style.transform = ''; 
                if(diff > 50) {
                    const cleanText = getCleanText(msg.teks);
                    const snippet = cleanText.length > 30 ? cleanText.substring(0, 30) + "..." : cleanText;
                    replyTo = { sender: msg.nama, snippet: snippet };
                    document.getElementById('status-content').innerText = snippet;
                    document.getElementById('status-bar').classList.remove('hidden');
                    document.getElementById('chat-msg').focus();
                    if(navigator.vibrate) navigator.vibrate(20);
                }
            });
        }

        function toggleNav(s) { document.getElementById('nav-menu').classList.toggle('modal-active', s); }
        function clearStatus() { replyTo = null; editId = null; document.getElementById('status-bar').classList.add('hidden'); }
        function toggleVO() { isVO = !isVO; const btn = document.getElementById('vo-toggle'); btn.classList.toggle('text-red-500', isVO); btn.classList.toggle('border-red-500', isVO); }
        function previewImg(i) { if(i.files?.[0]) { const r = new FileReader(); r.onload = e => { pendingImg = e.target.result; document.getElementById('img-preview-container').classList.remove('hidden'); document.getElementById('img-preview-tag').src = pendingImg; }; r.readAsDataURL(i.files[0]); } }
        function clearImage() { pendingImg = null; document.getElementById('img-input').value = ""; document.getElementById('img-preview-container').classList.add('hidden'); }
        
        // --- FIXED OPEN VIEW ONCE ---
        async function openViewOnce(id, rawContent, type) {
            const m = document.getElementById('vo-modal');
            const img = document.getElementById('vo-full-img');
            const txt = document.getElementById('vo-text-content');
            const box = document.getElementById('vo-text-container');
            
            img.classList.add('hidden'); box.classList.add('hidden');
            
            if(type === 'image') {
                // PENTING: Hapus prefix [VO][IMG] sebelum menampilkan gambar
                const cleanSrc = rawContent.replace("[VO][IMG]", "").split("|")[0]; 
                img.src = cleanSrc;
                img.classList.remove('hidden');
            } else {
                const text = rawContent.replace("[VO]", "");
                txt.innerText = text;
                box.classList.remove('hidden');
            }
            
            m.classList.add('modal-active');
            await supa.from('Pesan').delete().eq('id', id);
            document.getElementById(`m-${id}`)?.remove();
        }

        function closeViewOnce() { document.getElementById('vo-modal').classList.remove('modal-active'); }

        function showOpts(m, me) {
            selectedMsg = m;
            const menu = document.getElementById('context-menu');
            menu.classList.add('modal-active');
            document.getElementById('btn-delete').classList.toggle('hidden', !me);
            const isSpecial = m.teks.startsWith("[") || m.nama === "ORACLE";
            document.getElementById('btn-edit').classList.toggle('hidden', !me || isSpecial);
        }

        function handleCopy() {
            const txt = getCleanText(selectedMsg.teks);
            navigator.clipboard.writeText(txt);
            document.getElementById('context-menu').classList.remove('modal-active');
        }

        function handleEdit(e) {
            if(!selectedMsg) return;
            editId = selectedMsg.id;
            let val = selectedMsg.teks;
            if(val.includes(">>REPLY|")) val = val.split(">>").pop();
            document.getElementById('chat-msg').value = val;
            document.getElementById('status-label').innerText = "MENGEDIT";
            document.getElementById('status-content').innerText = val;
            document.getElementById('status-bar').classList.remove('hidden');
            document.getElementById('context-menu').classList.remove('modal-active');
        }

        async function handleDelete() {
            if(confirm("Hapus pesan ini?")) {
                await supa.from('Pesan').delete().eq('id', selectedMsg.id);
                document.getElementById('context-menu').classList.remove('modal-active');
            }
        }
        
        async function clearHistory() {
            if(confirm("Hapus semua chat?")) {
                await supa.from('Pesan').delete().neq('id', 0);
                document.getElementById('chat-feed').innerHTML = "";
                toggleNav(false);
            }
        }

        function updateConnStatus(msg, type='normal') {
            const el = document.getElementById('conn-status');
            el.innerText = msg;
            el.style.color = type==='error'?'#ef4444':'#D4AF37';
            el.classList.add('active');
            if(type==='success') setTimeout(()=>el.classList.remove('active'), 2000);
        }

        function connect() {
            updateConnStatus("Menghubungkan...");
            supa.from('Pesan').select('*').order('id', {ascending: false}).limit(50).then(({data}) => {
                if(data) {
                    data.reverse().forEach(m => handleIncomingMessage(m));
                    isInitialLoad = false;
                    lastMessageId = data[data.length-1]?.id || 0;
                    updateConnStatus("Terkoneksi", 'success');
                }
            });

            channel = supa.channel('oracle_room_v17')
                .on('postgres_changes', {event: '*', schema: 'public', table: 'Pesan'}, payload => {
                    if(payload.eventType === 'INSERT') handleIncomingMessage(payload.new);
                    if(payload.eventType === 'DELETE') document.getElementById(`m-${payload.old.id}`)?.remove();
                    if(payload.eventType === 'UPDATE') render(payload.new);
                })
                .subscribe();
        }

        // --- ANIMASI ASCEND (MASUK) ---
        async function ascend() {
            const val = document.getElementById('name-input').value.trim();
            if(!val) return;

            // 1. Trigger Animasi Portal
            const portal = document.getElementById('portal-overlay');
            portal.classList.add('active'); // Layar jadi putih/emas

            // 2. Delay agar animasi terasa (1.5 detik)
            await new Promise(r => setTimeout(r, 1500));

            // 3. Pindah Layer (Logic Asli)
            myName = val;
            localStorage.setItem('oracle_user_v17', myName);
            document.getElementById('layer-name').classList.add('layer-hidden');
            document.getElementById('layer-main').classList.remove('layer-hidden');

            // 4. Buka Portal & Connect
            portal.classList.remove('active');
            connect();
        }

        document.getElementById('sec-input').addEventListener('input', e => {
            if(e.target.value === '010304') {
                document.getElementById('layer-sec').classList.add('layer-hidden');
                document.getElementById('layer-name').classList.remove('layer-hidden');
            }
        });

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("SW Registered"))
                    .catch(err => console.log("SW Fail:", err));
            });
        }

        if(myName) {
            document.getElementById('layer-sec').classList.add('layer-hidden');
            document.getElementById('layer-name').classList.add('layer-hidden');
            document.getElementById('layer-main').classList.remove('layer-hidden');
            connect();
        }

        async function startVoiceRecording() {
            const btn = document.getElementById('mic-btn');
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                btn.classList.remove('text-red-500', 'border-red-500');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.onloadend = () => send(`[VN]${reader.result}`);
                    reader.readAsDataURL(new Blob(audioChunks, {type:'audio/webm'}));
                    stream.getTracks().forEach(t=>t.stop());
                };
                mediaRecorder.start();
                btn.classList.add('text-red-500', 'border-red-500');
            } catch (err) { alert("Mic Error: " + err); }
        }
    </script>
